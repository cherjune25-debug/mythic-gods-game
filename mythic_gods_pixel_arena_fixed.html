<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mythic Gods: Pixel Arena — Fix</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#174b36;color:#fff;font-family:system-ui,Arial;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}.panel{background:#101a2be8;border:1px solid #ffffff45;border-radius:12px;padding:8px;box-shadow:0 3px 12px #0005}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font-size:11px}
#heroInfo{width:42%}#heroName{font-size:13px;font-weight:900;color:#ffdc78}#objective{text-align:center;max-width:34%}#rightInfo{text-align:right}
.bar{height:8px;background:#542c36;border-radius:8px;overflow:hidden;margin:4px 0}#hpFill{height:100%;background:#5ce18b;width:100%}
#message{position:absolute;top:82px;left:50%;transform:translateX(-50%);font-size:11px;background:#101a2bdd;padding:7px 10px;border-radius:10px;max-width:94%;text-align:center}
#controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end}
#joy{width:118px;height:118px;border:2px solid #ffffff88;background:#101a2b88;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:44px;height:44px;left:35px;top:35px;border-radius:50%;background:#d9e5ffcc;border:2px solid white}
#buttons{display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}.action{width:64px;height:64px;border-radius:50%;border:2px solid #ffffff99;background:#172b47ee;color:white;font-weight:900;font-size:11px;touch-action:none}#attack{background:#9b382f}
#start{position:absolute;inset:0;background:#071426e8;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(440px,100%);background:#101a2bf5;border:1px solid #ffffff55;border-radius:18px;padding:20px;text-align:center}
.logo{font-size:clamp(28px,7vw,42px);font-weight:1000;color:#ffdc78}.gods{display:flex;gap:8px;margin-top:12px}.god{flex:1;padding:10px 4px;border-radius:12px;border:1px solid #ffffff40;background:#1b2a40;color:white;font-weight:800}.god.sel{border:2px solid #ffdc78;background:#493923}
#play{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(#ffe48a,#e7a82e);font-weight:1000;font-size:15px;margin-top:14px}
@media(min-width:700px){#joy{width:132px;height:132px}#stick{left:42px;top:42px}.action{width:70px;height:70px}#buttons{grid-template-columns:repeat(2,70px)}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div id="top">
<div id="heroInfo" class="panel"><div id="heroName">ZEUS · THUNDER GOD</div><div class="bar"><div id="hpFill"></div></div><div id="stats">HP 1000 / 1000 · LV 1</div></div>
<div id="objective" class="panel">DESTROY ENEMY CORE<br><b id="coreText">CORE 100%</b></div>
<div id="rightInfo" class="panel">PIXEL ARENA<br><span id="score">KOs 0 · Gold 0</span></div>
</div><div id="message">Choose a god and enter the arena</div>
<div id="controls"><div id="joy"><div id="stick"></div></div><div id="buttons"><button class="action" id="s1">⚡<br>SKILL 1</button><button class="action" id="s2">✦<br>SKILL 2</button><button class="action" id="ult">☄<br>ULT</button><button class="action" id="attack">⚔<br>ATTACK</button></div></div>
</div>
<div id="start"><div class="card"><div class="logo">MYTHIC GODS</div><p>PIXEL ARENA · MOBILE MOBA</p><b>Choose your god</b><div class="gods"><button class="god sel" data-god="zeus">⚡ ZEUS<br><small>Ranged mage</small></button><button class="god" data-god="anubis">𓃥 ANUBIS<br><small>Dark mage</small></button><button class="god" data-god="odin">🛡️ ODIN<br><small>Warrior</small></button></div><button id="play">ENTER THE ARENA</button></div></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,dpr=1,chosen='zeus',running=false,last=0,joy={x:0,y:0},drag=false,keys={},hero=null,enemies=[],minions=[],shots=[],time=0,kos=0,gold=0,core;
const MW=1500,MH=1000;
const gods={zeus:{name:'ZEUS · THUNDER GOD',glyph:'⚡',color:'#5bd6ff',hp:1000,damage:55,speed:190,range:160},anubis:{name:'ANUBIS · SOUL KEEPER',glyph:'𓃥',color:'#d1a0ff',hp:1120,damage:50,speed:176,range:145},odin:{name:'ODIN · ALLFATHER',glyph:'🛡️',color:'#ffbb68',hp:1350,damage:68,speed:165,range:105}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px'}addEventListener('resize',resize);resize();
function spawn(team,x,y){return {team,x,y,hp:team==='blue'?150:260,maxHp:team==='blue'?150:260,r:team==='blue'?11:17,damage:team==='blue'?14:22,speed:team==='blue'?48:42,cd:Math.random(),color:team==='blue'?'#65d9ff':'#ff687a'}}
function reset(){const g=gods[chosen];hero={x:170,y:500,r:20,hp:g.hp,maxHp:g.hp,damage:g.damage,speed:g.speed,range:g.range,color:g.color,glyph:g.glyph,level:1,dead:false};enemies=[];minions=[];shots=[];time=0;kos=0;gold=0;core={x:1370,y:500,hp:2400,maxHp:2400};for(let i=0;i<5;i++){minions.push(spawn('blue',230+i*18,475+i*12));minions.push(spawn('red',1200+i*18,515+i*12))}for(let i=0;i<6;i++)enemies.push(spawn('red',780+(i%3)*110,250+Math.floor(i/3)*480));running=true;$('start').style.display='none';$('message').textContent='Move with joystick. Attack enemies and destroy the red core!';}
function nearest(arr,a,r){let best=null,bd=r;for(const o of arr){if(o.hp<=0)continue;const d=dist(a,o);if(d<bd){bd=d;best=o}}return best}
function hit(o,n){if(!o||o.hp<=0)return;o.hp=Math.max(0,o.hp-n);if(o.hp===0&&o.team==='red'){kos++;gold+=25}}
function attack(){if(!running)return;let t=nearest([...enemies,...minions.filter(m=>m.team==='red')],hero,hero.range+45);if(t){hit(t,hero.damage);$('message').textContent='Hit enemy!'}else if(dist(hero,core)<hero.range+80){core.hp=Math.max(0,core.hp-hero.damage);$('message').textContent='Enemy core damaged!'}else $('message').textContent='Move closer to enemies or enemy core.'}
function skill(id){if(!running)return;let rad=id==='ult'?250:id==='s2'?165:115,dmg=id==='ult'?260:id==='s2'?140:100,n=0;for(const o of [...enemies,...minions.filter(m=>m.team==='red')])if(dist(hero,o)<rad){hit(o,dmg);n++}if(dist(hero,core)<rad+35){core.hp=Math.max(0,core.hp-dmg);n++}$('message').textContent=(id==='ult'?'ULTIMATE! ':'SKILL! ')+(n?'Hit '+n+' targets':'No enemies in range')}
function update(dt){if(!running)return;time+=dt;let mx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}hero.x=clamp(hero.x+mx*hero.speed*dt,40,MW-40);hero.y=clamp(hero.y+my*hero.speed*dt,80,MH-80);
for(const e of enemies){if(e.hp<=0)continue;let t=dist(e,hero)<230?hero:nearest(minions.filter(m=>m.team==='blue'),e,190);if(t){if(dist(e,t)>95){const d=dist(e,t)||1;e.x+=(t.x-e.x)/d*e.speed*dt;e.y+=(t.y-e.y)/d*e.speed*dt}else{e.cd-=dt;if(e.cd<=0){if(t===hero)hero.hp=Math.max(0,hero.hp-e.damage);else t.hp=Math.max(0,t.hp-e.damage);e.cd=1.2}}}}
for(const m of minions){if(m.hp<=0)continue;let foes=m.team==='blue'?[...enemies,...minions.filter(q=>q.team==='red')]:[hero,...minions.filter(q=>q.team==='blue')];let t=nearest(foes,m,90);if(t){m.cd-=dt;if(m.cd<=0){hit(t,m.damage);m.cd=1.1}}else m.x+=(m.team==='blue'?1:-1)*m.speed*dt}
enemies=enemies.filter(o=>o.hp>0);minions=minions.filter(o=>o.hp>0);if(core.hp<=0){running=false;$('message').textContent='VICTORY! Enemy core destroyed — tap Enter the Arena to play again.';$('start').style.display='flex';$('play').textContent='PLAY AGAIN'}
$('hpFill').style.width=(hero.hp/hero.maxHp*100)+'%';$('heroName').textContent=gods[chosen].name;$('stats').textContent=`HP ${Math.ceil(hero.hp)} / ${hero.maxHp} · LV ${hero.level}`;$('coreText').textContent='CORE '+Math.ceil(core.hp/core.maxHp*100)+'%';$('score').textContent=`KOs ${kos} · Gold ${gold}`}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function drawUnit(o,isHero=false){circle(o.x,o.y+6,o.r,'#17271f99');circle(o.x,o.y,o.r,o.color|| (o.team==='blue'?'#55cfff':'#ff6478'),isHero?'#fff2a0':o.team==='blue'?'#b5efff':'#ffc2c8');ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(isHero?o.glyph:o.team==='blue'?'•':'✦',o.x,o.y+5);ctx.fillStyle='#1a1a1a';ctx.fillRect(o.x-o.r,o.y-o.r-9,o.r*2,4);ctx.fillStyle=isHero||o.team==='blue'?'#58e58a':'#ff455f';ctx.fillRect(o.x-o.r,o.y-o.r-9,o.r*2*Math.max(0,o.hp/o.maxHp),4);if(isHero){ctx.strokeStyle='#ffe88b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.x,o.y,o.r+6,0,Math.PI*2);ctx.stroke()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#347b4b';ctx.fillRect(0,0,W,H);const scale=Math.min(W/MW,H/MH);ctx.save();ctx.translate((W-MW*scale)/2,(H-MH*scale)/2);ctx.scale(scale,scale);
for(let y=0;y<MH;y+=60)for(let x=0;x<MW;x+=60){ctx.fillStyle=((x/60+y/60)%2)?'#317448':'#397f4d';ctx.fillRect(x,y,60,60)}
// Lanes and river
for(const y of [250,500,750]){ctx.lineCap='round';ctx.strokeStyle='#898b72';ctx.lineWidth=82;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(MW-35,y);ctx.stroke();ctx.strokeStyle='#c5bd91';ctx.lineWidth=66;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(MW-35,y);ctx.stroke();ctx.strokeStyle='#e6dca9';ctx.lineWidth=2;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(MW-35,y);ctx.stroke();ctx.setLineDash([])}
ctx.strokeStyle='#247e9b';ctx.lineWidth=60;ctx.beginPath();ctx.moveTo(760,20);ctx.bezierCurveTo(670,250,850,350,750,500);ctx.bezierCurveTo(670,690,850,800,750,980);ctx.stroke();ctx.strokeStyle='#5ab6c6';ctx.lineWidth=42;ctx.stroke();
function base(x,y,color){circle(x,y,42,color,'#ffe9a6');ctx.fillStyle='#f1e8c5';ctx.fillRect(x-17,y-17,34,34);ctx.fillStyle=color;ctx.fillRect(x-9,y-9,18,18)}
base(80,500,'#278dcc');base(1420,500,'#b73555');
for(const x of [390,1110])for(const y of [250,500,750]){circle(x,y,24,x<500?'#3b9bd0':'#d94d64','#e8e4c9');ctx.fillStyle='#fff';ctx.fillRect(x-5,y-12,10,24)}
circle(core.x,core.y,34,'#9d3157','#ffb7c3');ctx.save();ctx.translate(core.x,core.y);ctx.rotate(time);ctx.fillStyle='#ff7992';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(22,0);ctx.lineTo(0,24);ctx.lineTo(-22,0);ctx.fill();ctx.restore();
for(const m of minions)drawUnit(m);for(const e of enemies)drawUnit(e);if(hero)drawUnit(hero,true);
ctx.restore();requestAnimationFrame(loop)}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw()}
document.querySelectorAll('.god').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.god').forEach(q=>q.classList.remove('sel'));b.classList.add('sel');chosen=b.dataset.god}));
$('play').addEventListener('click',reset);$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('s1').addEventListener('pointerdown',e=>{e.preventDefault();skill('s1')});$('s2').addEventListener('pointerdown',e=>{e.preventDefault();skill('s2')});$('ult').addEventListener('pointerdown',e=>{e.preventDefault();skill('ult')});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();attack()}if(e.key==='1')skill('s1');if(e.key==='2')skill('s2');if(e.key==='3')skill('ult')});addEventListener('keyup',e=>keys[e.key]=false);
const joyEl=$('joy'),stick=$('stick');function setJoy(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,d=Math.hypot(dx,dy);joy.x=(d?dx/d*Math.min(d,max):0)/max;joy.y=(d?dy/d*Math.min(d,max):0)/max;stick.style.left=(r.width/2-22+joy.x*max)+'px';stick.style.top=(r.height/2-22+joy.y*max)+'px'}
joyEl.addEventListener('pointerdown',e=>{drag=true;joyEl.setPointerCapture(e.pointerId);setJoy(e)});joyEl.addEventListener('pointermove',e=>{if(drag)setJoy(e)});function release(){drag=false;joy.x=joy.y=0;stick.style.left='calc(50% - 22px)';stick.style.top='calc(50% - 22px)'}joyEl.addEventListener('pointerup',release);joyEl.addEventListener('pointercancel',release);
requestAnimationFrame(loop);
})();
</script></body></html>
