<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mythic Gods: Pixel Arena — Isometric 2.5D Upgrade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#174b36;color:#fff;font-family:system-ui,Arial;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}.panel{background:#101a2be8;border:1px solid #ffffff45;border-radius:12px;padding:8px;box-shadow:0 3px 12px #0005}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font-size:11px}
#heroInfo{width:42%}#heroName{font-size:13px;font-weight:900;color:#ffdc78}#objective{text-align:center;max-width:34%}#rightInfo{text-align:right}
.bar{height:8px;background:#542c36;border-radius:8px;overflow:hidden;margin:4px 0}#hpFill{height:100%;background:#5ce18b;width:100%}
#message{position:absolute;top:82px;left:50%;transform:translateX(-50%);font-size:11px;background:#101a2bdd;padding:7px 10px;border-radius:10px;max-width:94%;text-align:center}
#controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end}
#joy{width:118px;height:118px;border:2px solid #ffffff88;background:#101a2b88;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:44px;height:44px;left:35px;top:35px;border-radius:50%;background:#d9e5ffcc;border:2px solid white}
#buttons{display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}.action{width:64px;height:64px;border-radius:50%;border:2px solid #ffffff99;background:#172b47ee;color:white;font-weight:900;font-size:11px;touch-action:none}#attack{background:#9b382f}
#start{position:absolute;inset:0;background:#071426e8;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(440px,100%);background:#101a2bf5;border:1px solid #ffffff55;border-radius:18px;padding:20px;text-align:center}
.logo{font-size:clamp(28px,7vw,42px);font-weight:1000;color:#ffdc78}.gods{display:flex;gap:8px;margin-top:12px}.god{flex:1;padding:10px 4px;border-radius:12px;border:1px solid #ffffff40;background:#1b2a40;color:white;font-weight:800}.god.sel{border:2px solid #ffdc78;background:#493923}
#play{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(#ffe48a,#e7a82e);font-weight:1000;font-size:15px;margin-top:14px}
@media(min-width:700px){#joy{width:132px;height:132px}#stick{left:42px;top:42px}.action{width:70px;height:70px}#buttons{grid-template-columns:repeat(2,70px)}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div id="top">
<div id="heroInfo" class="panel"><div id="heroName">ZEUS · THUNDER GOD</div><div class="bar"><div id="hpFill"></div></div><div id="stats">HP 1000 / 1000 · LV 1</div></div>
<div id="objective" class="panel">DESTROY ENEMY CORE<br><b id="coreText">CORE 100%</b></div>
<div id="rightInfo" class="panel">PIXEL ARENA<br><span id="score">KOs 0 · Gold 0</span></div>
</div><div id="message">Choose a god and enter the arena</div>
<div id="controls"><div id="joy"><div id="stick"></div></div><div id="buttons"><button class="action" id="s1">⚡<br>SKILL 1</button><button class="action" id="s2">✦<br>SKILL 2</button><button class="action" id="ult">☄<br>ULT</button><button class="action" id="attack">⚔<br>ATTACK</button></div></div>
</div>
<div id="start"><div class="card"><div class="logo">MYTHIC GODS</div><p>PIXEL ARENA · MOBILE MOBA</p><b>Choose your god</b><div class="gods"><button class="god sel" data-god="zeus">⚡ ZEUS<br><small>Ranged mage</small></button><button class="god" data-god="anubis">𓃥 ANUBIS<br><small>Dark mage</small></button><button class="god" data-god="odin">🛡️ ODIN<br><small>Warrior</small></button></div><button id="play">ENTER THE ARENA</button></div></div>
<script>
(()=>{
// TERRAIN UPGRADE v2: layered ridges, detailed stone lanes, deeper riverbanks, shaded trees and faceted bases.
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,dpr=1,chosen='zeus',running=false,last=0,joy={x:0,y:0},drag=false,keys={},hero=null,enemies=[],minions=[],shots=[],towers=[],camps=[],time=0,kos=0,gold=0,core,cam={x:0,y:0,ready:false};
// MOBA balance: attacks and skills have cooldowns; structures take reduced damage.
let attackCd=0,skillCds={s1:0,s2:0,ult:0};
const SKILL_COOLDOWNS={s1:5,s2:8,ult:24};
const MW=1500,MH=1000;
const gods={zeus:{name:'ZEUS · THUNDER GOD',glyph:'⚡',color:'#5bd6ff',hp:1000,damage:55,speed:190,range:160},anubis:{name:'ANUBIS · SOUL KEEPER',glyph:'𓃥',color:'#d1a0ff',hp:1120,damage:50,speed:176,range:145},odin:{name:'ODIN · ALLFATHER',glyph:'🛡️',color:'#ffbb68',hp:1350,damage:68,speed:165,range:105}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px'}addEventListener('resize',resize);resize();
function spawn(team,x,y){const blue=team==='blue';return {team,x,y,hp:blue?240:300,maxHp:blue?240:300,r:blue?11:17,damage:blue?18:24,speed:blue?48:42,cd:Math.random(),color:blue?'#65d9ff':'#ff687a'}}
function reset(){const g=gods[chosen];hero={x:170,y:500,r:20,hp:g.hp,maxHp:g.hp,damage:g.damage,speed:g.speed,range:g.range,color:g.color,glyph:g.glyph,level:1,dead:false};attackCd=0;skillCds={s1:0,s2:0,ult:0};cam.ready=false;enemies=[];minions=[];shots=[];time=0;kos=0;gold=0;core={x:1370,y:500,hp:3500,maxHp:3500};towers=[];for(const y of [250,500,750]){for(const x of [260,520])towers.push({team:'blue',x,y,hp:2000,maxHp:2000,r:25,range:175,damage:70,cd:.4});for(const x of [980,1240])towers.push({team:'red',x,y,hp:2000,maxHp:2000,r:25,range:175,damage:70,cd:.7});}camps=[[390,365,'Golem','#b7b9a7',750],[1110,365,'Ember Beast','#e88b54',700],[390,635,'Stone Brute','#a9b6c4',750],[1110,635,'Void Beast','#b88cff',700],[600,205,'Blue Sentinel','#56c9ff',1050],[900,795,'Crimson Sentinel','#ff6a7b',1050]].map(([x,y,name,color,hp])=>({x,y,name,color,hp,maxHp:hp,r:21,damage:24,cd:1,alive:true,respawn:0}));for(let i=0;i<5;i++){minions.push(spawn('blue',230+i*18,475+i*12));minions.push(spawn('red',1200+i*18,515+i*12))}for(let i=0;i<6;i++)enemies.push(spawn('red',780+(i%3)*110,250+Math.floor(i/3)*250));running=true;$('start').style.display='none';$('message').textContent='ISOMETRIC 2.5D ARENA: destroy towers, farm jungle camps, push the red core!';}
function nearest(arr,a,r){let best=null,bd=r;for(const o of arr){if(o.hp<=0)continue;const d=dist(a,o);if(d<bd){bd=d;best=o}}return best}
function hit(o,n){if(!o||o.hp<=0)return;o.hp=Math.max(0,o.hp-n);if(o.hp===0&&o.team==='red'){kos++;gold+=25}}
function damageTarget(o,raw,kind='skill'){
 if(!o||o.hp<=0)return 0;
 let mult=1;
 // Basic attacks and skills are much less effective against objectives, as in a MOBA.
 if('range'in o) mult=kind==='basic'?0.70:0.32; // towers
 else if(o===core) mult=kind==='basic'?0.65:0.28; // core
 else if('alive'in o) mult=kind==='basic'?0.62:0.72; // jungle monsters
 const dealt=Math.max(1,Math.round(raw*mult));
 if('alive'in o){o.hp=Math.max(0,o.hp-dealt);if(o.hp<=0){o.alive=false;o.respawn=30;gold+=50;$('message').textContent=o.name+' defeated! +50 gold';}}
 else if('range'in o){o.hp=Math.max(0,o.hp-dealt);if(o.hp<=0){gold+=75;$('message').textContent='Enemy tower destroyed! +75 gold';}else $('message').textContent='Enemy tower hit! ('+dealt+' damage)';}
 else if(o===core){o.hp=Math.max(0,o.hp-dealt);$('message').textContent='Enemy core hit! ('+dealt+' damage)';}
 else {const before=o.hp;hit(o,dealt);}
 return dealt;
}
function attack(){
 if(!running||!hero||attackCd>0)return;
 attackCd=0.52;
 let t=nearest([...enemies,...minions.filter(m=>m.team==='red'),...towers.filter(q=>q.team==='red'&&q.hp>0),...camps.filter(q=>q.alive)],hero,hero.range+45);
 if(t){damageTarget(t,hero.damage,'basic');if(!('range'in t)&&!('alive'in t)&&t!==core)$('message').textContent='Basic attack!';}
 else if(dist(hero,core)<hero.range+80)damageTarget(core,hero.damage,'basic');
 else $('message').textContent='Move closer to an enemy, tower, or jungle monster.';
}
function skill(id){
 if(!running||!hero)return;
 if(skillCds[id]>0){$('message').textContent=id.toUpperCase()+' cooling down: '+Math.ceil(skillCds[id])+'s';return;}
 skillCds[id]=SKILL_COOLDOWNS[id];
 const rad=id==='ult'?235:id==='s2'?155:115;

 const dmg=id==='ult'?235:id==='s2'?125:85;
 let n=0;
 for(const o of [...enemies,...minions.filter(m=>m.team==='red'),...towers.filter(q=>q.team==='red'&&q.hp>0)])if(dist(hero,o)<rad){damageTarget(o,dmg,'skill');n++;}
 for(const m of camps)if(m.alive&&dist(hero,m)<rad){damageTarget(m,dmg,'skill');n++;}
 if(dist(hero,core)<rad+35){damageTarget(core,dmg,'skill');n++;}
 $('message').textContent=(id==='ult'?'ULTIMATE! ':'SKILL! ')+(n?'Hit '+n+' targets · cooldown '+SKILL_COOLDOWNS[id]+'s':'No enemies in range · cooldown '+SKILL_COOLDOWNS[id]+'s');
}
function update(dt){if(!running)return;time+=dt;attackCd=Math.max(0,attackCd-dt);for(const k in skillCds)skillCds[k]=Math.max(0,skillCds[k]-dt);let mx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(mx,my);if(len>1){mx/=len;my/=len}hero.x=clamp(hero.x+mx*hero.speed*dt,40,MW-40);hero.y=clamp(hero.y+my*hero.speed*dt,80,MH-80);
for(const e of enemies){if(e.hp<=0)continue;let t=dist(e,hero)<230?hero:nearest(minions.filter(m=>m.team==='blue'),e,190);if(t){if(dist(e,t)>95){const d=dist(e,t)||1;e.x+=(t.x-e.x)/d*e.speed*dt;e.y+=(t.y-e.y)/d*e.speed*dt}else{e.cd-=dt;if(e.cd<=0){if(t===hero)hero.hp=Math.max(0,hero.hp-e.damage);else t.hp=Math.max(0,t.hp-e.damage);e.cd=1.35}}}}
for(const m of minions){if(m.hp<=0)continue;let foes=m.team==='blue'?[...enemies,...minions.filter(q=>q.team==='red')]:[hero,...minions.filter(q=>q.team==='blue')];let t=nearest(foes,m,90);if(t){m.cd-=dt;if(m.cd<=0){hit(t,m.damage);m.cd=1.1}}else m.x+=(m.team==='blue'?1:-1)*m.speed*dt}
// Defensive towers automatically fire at nearby opposing heroes, minions, and enemy units.
for(const tw of towers){if(tw.hp<=0)continue;const foes=tw.team==='blue'?[hero,...enemies,...minions.filter(m=>m.team==='red')]:[hero,...minions.filter(m=>m.team==='blue')];const target=nearest(foes.filter(o=>o!==hero||tw.team==='red'),tw,tw.range);if(target){tw.cd-=dt;if(tw.cd<=0){target.hp=Math.max(0,target.hp-tw.damage);tw.cd=1.35;shots.push({x:tw.x,y:tw.y,tx:target.x,ty:target.y,team:tw.team,life:.18})}}}
// Jungle monsters wake when the hero comes close, chase, strike, then respawn after defeat.
for(const m of camps){if(!m.alive){m.respawn-=dt;if(m.respawn<=0){m.alive=true;m.hp=m.maxHp}continue}if(dist(m,hero)<150){const d=dist(m,hero)||1;if(d>48){m.x+=(hero.x-m.x)/d*35*dt;m.y+=(hero.y-m.y)/d*35*dt}else{m.cd-=dt;if(m.cd<=0){hero.hp=Math.max(0,hero.hp-m.damage);m.cd=1.45}}}}
for(const sh of shots){sh.life-=dt}shots=shots.filter(sh=>sh.life>0);
enemies=enemies.filter(o=>o.hp>0);minions=minions.filter(o=>o.hp>0);if(core.hp<=0){running=false;$('message').textContent='VICTORY! Enemy core destroyed — tap Enter the Arena to play again.';$('start').style.display='flex';$('play').textContent='PLAY AGAIN'}else if(hero.hp<=0){hero.hp=0;running=false;$('message').textContent='DEFEAT! Your hero was defeated — tap Enter the Arena to try again.';$('start').style.display='flex';$('play').textContent='TRY AGAIN'}
$('hpFill').style.width=(hero.hp/hero.maxHp*100)+'%';$('heroName').textContent=gods[chosen].name;$('stats').textContent=`HP ${Math.ceil(hero.hp)} / ${hero.maxHp} · LV ${hero.level}`;$('coreText').textContent='CORE '+Math.ceil(core.hp/core.maxHp*100)+'%';$('score').textContent=`KOs ${kos} · Gold ${gold}`}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function project(x,y){return {x:500+(x-y)*0.62,y:28+(x+y)*0.30}}
function drawUnit(o,isHero=false){const p=project(o.x,o.y),x=p.x,y=p.y,r=o.r*0.72;circle(x,y+5,r,'#14261b99');circle(x,y,r,o.color||(o.team==='blue'?'#55cfff':'#ff6478'),isHero?'#fff2a0':o.team==='blue'?'#b5efff':'#ffc2c8');ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(isHero?o.glyph:o.team==='blue'?'•':'✦',x,y+5);ctx.fillStyle='#17201b';ctx.fillRect(x-r,y-r-9,r*2,4);ctx.fillStyle=isHero||o.team==='blue'?'#58e58a':'#ff455f';ctx.fillRect(x-r,y-r-9,r*2*Math.max(0,o.hp/o.maxHp),4);if(isHero){ctx.strokeStyle='#ffe88b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r+6,(r+6)*.62,0,0,Math.PI*2);ctx.stroke()}}
function drawTree(x,y,size=1){
 // Layered, shaded canopy with a visible trunk and cast shadow: stylized 2.5D tree.
 ctx.fillStyle='#142f22a8';ctx.beginPath();ctx.ellipse(x+5*size,y+11*size,25*size,12*size,-.12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#3e2c23';ctx.beginPath();ctx.moveTo(x-5*size,y+9*size);ctx.lineTo(x-3*size,y-13*size);ctx.lineTo(x+4*size,y-17*size);ctx.lineTo(x+7*size,y+10*size);ctx.closePath();ctx.fill();
 ctx.fillStyle='#765239';ctx.fillRect(x-2*size,y-14*size,5*size,20*size);
 for(const a of [[0,-25,'#174b30',14],[-12,-16,'#22643a',13],[12,-16,'#2b7540',13],[-5,-7,'#31864a',14],[8,-7,'#3c9650',11],[0,-18,'#50a75a',8]]){ctx.fillStyle=a[2];ctx.beginPath();ctx.arc(x+a[0]*size,y+a[1]*size,a[3]*size,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle='#70bd68';ctx.lineWidth=2*size;ctx.beginPath();ctx.arc(x-5*size,y-20*size,7*size,3.6,5.5);ctx.stroke();
}
function drawBush(x,y,size=1){ctx.fillStyle='#163d29a8';ctx.beginPath();ctx.ellipse(x+2*size,y+5*size,22*size,10*size,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1c5c37';ctx.beginPath();ctx.ellipse(x,y,20*size,10*size,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f8547';ctx.beginPath();ctx.arc(x-8*size,y-2*size,8*size,0,Math.PI*2);ctx.arc(x+1*size,y-6*size,9*size,0,Math.PI*2);ctx.arc(x+10*size,y-1*size,7*size,0,Math.PI*2);ctx.fill();ctx.fillStyle='#69b967';ctx.beginPath();ctx.arc(x-3*size,y-7*size,3*size,0,Math.PI*2);ctx.arc(x+8*size,y-4*size,2.5*size,0,Math.PI*2);ctx.fill()}
function drawRock(x,y,size=1){ctx.fillStyle='#172e22aa';ctx.beginPath();ctx.ellipse(x+3*size,y+5*size,14*size,7*size,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#56675a';ctx.beginPath();ctx.moveTo(x-13*size,y+2*size);ctx.lineTo(x-8*size,y-8*size);ctx.lineTo(x+1*size,y-13*size);ctx.lineTo(x+13*size,y-4*size);ctx.lineTo(x+11*size,y+4*size);ctx.closePath();ctx.fill();ctx.fillStyle='#8d9a84';ctx.beginPath();ctx.moveTo(x-8*size,y-7*size);ctx.lineTo(x+1*size,y-13*size);ctx.lineTo(x+5*size,y-5*size);ctx.lineTo(x-3*size,y-2*size);ctx.closePath();ctx.fill();ctx.strokeStyle='#3e5145';ctx.lineWidth=1.5;ctx.stroke()}
function drawCliff(x,y,w,h){ctx.fillStyle='#172e25';ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2+8,y+h/2+13);ctx.lineTo(x-w/2+8,y+h/2+13);ctx.closePath();ctx.fill();ctx.fillStyle='#6c7d61';ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x,y-h/2-7);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x,y+h/2);ctx.closePath();ctx.fill();ctx.strokeStyle='#a2ad7d';ctx.lineWidth=2;ctx.stroke()}
function draw(){
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#102c29';ctx.fillRect(0,0,W,H);
// Smooth MOBA camera: follow the hero and keep the visible battlefield zoomed in.
const target=hero?project(hero.x,hero.y):project(750,500);const zoom=Math.min(1.42,Math.max(1.12,H/650));
if(!cam.ready){cam.x=target.x;cam.y=target.y;cam.ready=true}cam.x+=(target.x-cam.x)*0.13;cam.y+=(target.y-cam.y)*0.13;
ctx.save();ctx.translate(W*0.5-cam.x*zoom,H*0.47-cam.y*zoom);ctx.scale(zoom,zoom);
// Draw the battlefield as a diamond-shaped isometric world.
ctx.save();ctx.transform(.62,.30,-.62,.30,500,28);
// Raised beveled isometric board rim, so the battlefield reads as a floating 2.5D arena.
ctx.fillStyle='#132d25';ctx.fillRect(-24,-24,MW+48,MH+48);ctx.fillStyle='#294b35';ctx.fillRect(-12,-12,MW+24,MH+24);ctx.strokeStyle='#73956b';ctx.lineWidth=5;ctx.strokeRect(-5,-5,MW+10,MH+10);ctx.strokeStyle='#152e25';ctx.lineWidth=8;ctx.strokeRect(2,2,MW-4,MH-4);
ctx.fillStyle='#397d49';ctx.fillRect(0,0,MW,MH);
for(let y=0;y<MH;y+=60)for(let x=0;x<MW;x+=60){ctx.fillStyle=((x/60+y/60)%2)?'#347648':'#3b824c';ctx.fillRect(x,y,60,60);ctx.strokeStyle='#5b985333';ctx.lineWidth=1;ctx.strokeRect(x+1,y+1,58,58);if(((x*7+y*3)%4)===0){ctx.fillStyle='#72a75a55';ctx.beginPath();ctx.ellipse(x+18,y+20,12,5,-.4,0,Math.PI*2);ctx.fill()}}
for(const [x,y,w,h] of [[90,95,150,58],[310,78,115,44],[540,85,150,48],[960,85,145,48],[1190,78,130,50],[1400,110,135,56],[100,900,150,55],[330,920,145,45],[550,905,125,42],[960,910,145,45],[1190,920,140,52],[1400,900,130,55]])drawCliff(x,y,w,h);
function drawLedge(x,y,w,h,shade=0){
 const lift=18;ctx.fillStyle='#183d2b';ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();
 ctx.fillStyle=shade?'#496f48':'#557b4b';ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x,y-h/2-lift);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x,y+h/2+lift*.45);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#8eaa70';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x,y-h/2-lift);ctx.lineTo(x+w/2,y-h/2);ctx.stroke();
}
