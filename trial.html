<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mythic Gods - Isometric Trial</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#16271d;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#game{width:100vw;height:100dvh}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#101827e8;border:1px solid #ffffff45;border-radius:10px;padding:8px;font-size:12px}
.bar{height:7px;background:#343b48;border-radius:8px;overflow:hidden;margin-top:4px;width:130px}
.fill{height:100%;width:100%;background:#43eb78}
#mp{background:#49aaff}
#map{position:fixed;right:8px;top:86px;width:90px;height:70px;border:2px solid #ffffffaa;border-radius:6px;background:#25432c}
#message{position:fixed;left:50%;top:69px;transform:translateX(-50%);background:#101827d9;border-radius:9px;padding:7px 10px;font-size:11px;white-space:nowrap;pointer-events:none}
#joy{position:fixed;left:16px;bottom:22px;width:110px;height:110px;border:2px solid #ffffff65;background:#ffffff20;border-radius:50%;touch-action:none}
#knob{position:absolute;width:44px;height:44px;left:31px;top:31px;border:2px solid white;background:#ffffff91;border-radius:50%}
#actions{position:fixed;right:10px;bottom:20px;display:flex;align-items:flex-end;gap:7px}
button{border:2px solid #ffffff9c;color:white;background:#263f62;border-radius:50%;width:52px;height:52px;font-weight:bold;font-size:11px;touch-action:none}
button small{display:block;font-size:8px;font-weight:normal;margin-top:3px}
#atk{width:63px;height:63px;background:#a73935}
#ult{width:59px;height:59px;background:#6a429a}
@media(max-width:380px){#joy{width:94px;height:94px}#knob{left:24px;top:24px}#actions{gap:4px;right:5px}button{width:46px;height:46px}#atk{width:56px;height:56px}#ult{width:51px;height:51px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">
  <b>⚔ MYTHIC GODS</b><br>
  <span id="hptext">HP 1000/1000</span><div class="bar"><div id="hp" class="fill"></div></div>
  <span id="mptext">Energy 300/300</span><div class="bar"><div id="mp" class="fill"></div></div>
 </div>
 <div class="panel" style="text-align:right">🔵 <span id="bs">0</span> : <span id="rs">0</span> 🔴<br><span id="kills">Kills: 0</span></div>
</div>
<canvas id="map" width="180" height="140"></canvas>
<div id="message">Isometric Arena · Explore the battlefield!</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions">
 <button id="home">⌂<small>HEAL</small></button>
 <button id="atk">⚔<small>ATTACK</small></button>
 <button id="skill">✦<small>SKILL</small></button>
 <button id="ult">☄<small>ULT</small></button>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const map=document.getElementById('map'),mc=map.getContext('2d');
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

const world={w:1800,h:1400};
const SX=.72,SY=.38;
const project=(x,y,z=0)=>({x:(x-y)*SX,y:(x+y)*SY-z});
const hero={x:250,y:700,hp:1000,max:1000,energy:300,maxEnergy:300,speed:235,face:0,cd:0,scd:0,ucd:0,dead:0};
let camera={x:0,y:0},joy={x:0,y:0},blue=0,red=0,kills=0,last=performance.now();
let mobs=[],trees=[],rocks=[],effects=[];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function unit(team,x,y,type='minion'){
 let monster=type==='monster';
 return {team,x,y,type,r:monster?23:type==='hero'?19:12,
 hp:monster?420:type==='hero'?800:170,
 max:monster?420:type==='hero'?800:170,
 speed:monster?55:type==='hero'?90:55,
 cd:rand(0,.8),dead:false,homeX:x,homeY:y};
}
for(let i=0;i<7;i++){
 mobs.push(unit('blue',300+i*28,670+i%3*22));
 mobs.push(unit('red',1500-i*28,730+i%3*22));
 mobs.push(unit('blue',350+i*27,800+i%3*20));
 mobs.push(unit('red',1450-i*27,850+i%3*20));
}
mobs.push(unit('blue',230,700,'hero'),unit('red',1570,700,'hero'));
for(let i=0;i<8;i++){
 let x=rand(550,1300),y=rand(200,1200);
 mobs.push(unit('neutral',x,y,'monster'));
}
for(let i=0;i<95;i++){
 let x=rand(70,1730),y=rand(70,1330);
 if(Math.abs(y-700)<100)continue;
 trees.push({x,y,r:rand(12,25),h:rand(12,32)});
}
for(let i=0;i<36;i++)rocks.push({x:rand(100,1700),y:rand(100,1300),r:rand(9,20),h:rand(10,25)});

function say(s){document.getElementById('message').textContent=s}
function damage(m,n){
 if(!m||m.dead||m.hp<=0)return;
 m.hp-=n;
 effects.push({x:m.x,y:m.y,life:.35,text:'-'+n});
 if(m.hp<=0){
  m.dead=true;
  if(m.team==='red'){blue++;kills++;hero.energy=Math.min(hero.maxEnergy,hero.energy+25);say('Enemy defeated! +25 energy')}
  else if(m.team==='blue')red++;
  else if(m.type==='monster'){
   hero.hp=Math.min(hero.max,hero.hp+100);
   hero.energy=Math.min(hero.maxEnergy,hero.energy+35);
   say('Jungle monster defeated! +100 HP');
   setTimeout(()=>mobs.push(unit('neutral',m.homeX,m.homeY,'monster')),10000);
  }
 }
}
function nearest(range){
 return mobs.filter(m=>!m.dead&&m.hp>0&&(m.team==='red'||m.team==='neutral')&&dist(hero,m)<range).sort((a,b)=>dist(hero,a)-dist(hero,b))[0];
}
function attack(){
 if(hero.dead)return;
 hero.cd=.35;
 let m=nearest(150);
 if(m){hero.face=Math.atan2(m.y-hero.y,m.x-hero.x);damage(m,125);effects.push({x:m.x,y:m.y,life:.2,slash:true})}
 else effects.push({x:hero.x+Math.cos(hero.face)*45,y:hero.y+Math.sin(hero.face)*45,life:.18,slash:true});
}
function skill(){
 if(hero.dead||hero.scd>0||hero.energy<35)return;
 hero.energy-=35;hero.scd=3;
 mobs.forEach(m=>{if(!m.dead&&(m.team==='red'||m.team==='neutral')&&dist(hero,m)<190)damage(m,210)});
 effects.push({x:hero.x,y:hero.y,life:.55,r:190,magic:true});say('Skill activated!');
}
function ultimate(){
 if(hero.dead||hero.ucd>0||hero.energy<100)return;
 hero.energy-=100;hero.ucd=8;
 mobs.forEach(m=>{if(!m.dead&&(m.team==='red'||m.team==='neutral')&&dist(hero,m)<300)damage(m,350)});
 effects.push({x:hero.x,y:hero.y,life:.7,r:300,magic:true});say('ULTIMATE!');
}
function heal(){hero.x=240;hero.y=700;hero.hp=hero.max;hero.energy=hero.maxEnergy;hero.dead=false;say('Blue base: fully healed!')}
document.getElementById('atk').onpointerdown=e=>{e.preventDefault();attack()};
document.getElementById('skill').onpointerdown=e=>{e.preventDefault();skill()};
document.getElementById('ult').onpointerdown=e=>{e.preventDefault();ultimate()};
document.getElementById('home').onpointerdown=e=>{e.preventDefault();heal()};

let keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')attack();if(e.key.toLowerCase()==='q')skill();if(e.key.toLowerCase()==='e')ultimate()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
function joyMove(e){
 let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(dx,dy),max=r.width*.34;
 if(len>max){dx*=max/len;dy*=max/len}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.left=(r.width/2-22+dx)+'px';knob.style.top=(r.height/2-22+dy)+'px';
}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)joyMove(e)});
function joyEnd(){joy.x=joy.y=0;knob.style.left='';knob.style.top=''}
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);

// Screen coordinates from isometric world coordinates.
function screen(x,y,z=0){let p=project(x,y,z);return{x:p.x-camera.x+W/2,y:p.y-camera.y+H/2}}
function poly(points,fill,stroke=null){
 ctx.beginPath();points.forEach((p,i)=>{let q=screen(p[0],p[1],p[2]||0);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}
}
function diamond(x,y,rx,ry,color,stroke){
 let p=screen(x,y);
 ctx.beginPath();ctx.moveTo(p.x,p.y-ry);ctx.lineTo(p.x+rx,p.y);ctx.lineTo(p.x,p.y+ry);ctx.lineTo(p.x-rx,p.y);ctx.closePath();
 ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function ground(){
 ctx.fillStyle='#254c31';ctx.fillRect(0,0,W,H);
 // Isometric diamond ground tiles with varied grass
 for(let x=0;x<world.w;x+=100)for(let y=0;y<world.h;y+=100){
  let shade=((x/100*3+y/100*5)%7);
  diamond(x+50,y+50, SX*50,SY*50,shade<3?'#42774a':shade<5?'#477d4c':'#3c7044','#ffffff08');
 }
 // Lane paths across the map, projected as wide ribbons.
 function lane(points,width,color){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();points.forEach((p,i)=>{let q=screen(p[0],p[1]);if(!i)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.stroke();
  ctx.strokeStyle='#e3d0a14c';ctx.lineWidth=2;ctx.setLineDash([9,12]);
  ctx.beginPath();points.forEach((p,i)=>{let q=screen(p[0],p[1]);if(!i)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([]);
 }
 lane([[100,260],[500,380],[900,500],[1300,400],[1700,260]],30,'#9b916d');
 lane([[100,700],[500,700],[900,700],[1300,700],[1700,700]],40,'#c2b184');
 lane([[100,1160],[500,1000],[900,900],[1300,1030],[1700,1160]],30,'#9b916d');
 // River as an isometric polygon.
 poly([[880,80],[1010,80],[1060,350],[980,600],[1040,850],[970,1110],[1040,1360],[900,1360],[830,1110],[900,850],[830,600],[900,350]],'#237fa0','#69d2dc');
 poly([[915,100],[940,100],[975,350],[900,600],[960,850],[890,1110],[955,1340],[930,1340],[860,1110],[930,850],[870,600],[940,350]],'#45b3c6');
 // Stone bridges crossing the river.
 [390,700,1010].forEach(y=>{
  poly([[810,y-55],[1060,y-55],[1080,y+5],[830,y+5]],'#8b7355','#d0b78c');
  for(let x=830;x<1060;x+=28)poly([[x,y-48],[x+8,y-48],[x+14,y-3],[x+6,y-3]],'#c6a77a');
 });
 // Raised platforms and visible cliff faces.
 const cliffs=[
  {x:330,y:400,w:180,h:115,z:32},{x:630,y:270,w:155,h:95,z:24},
  {x:1390,y:420,w:190,h:120,z:35},{x:390,y:1030,w:170,h:110,z:27},
  {x:1380,y:1040,w:190,h:115,z:34},{x:720,y:1130,w:145,h:90,z:22}
 ];
 cliffs.forEach(c=>{
  let a=screen(c.x,c.y),rx=c.w*SX,ry=c.h*SY,z=c.z;
  // front wall
  ctx.beginPath();ctx.moveTo(a.x-rx,a.y);ctx.lineTo(a.x,a.y+ry);ctx.lineTo(a.x,a.y+ry+z);ctx.lineTo(a.x-rx,a.y+z);ctx.closePath();ctx.fillStyle='#534b39';ctx.fill();
  ctx.beginPath();ctx.moveTo(a.x,a.y+ry);ctx.lineTo(a.x+rx,a.y);ctx.lineTo(a.x+rx,a.y+z);ctx.lineTo(a.x,a.y+ry+z);ctx.closePath();ctx.fillStyle='#66563e';ctx.fill();
  ctx.beginPath();ctx.moveTo(a.x-rx,a.y);ctx.lineTo(a.x,a.y-ry);ctx.lineTo(a.x+rx,a.y);ctx.lineTo(a.x,a.y+ry);ctx.closePath();ctx.fillStyle='#658652';ctx.fill();ctx.strokeStyle='#a3b878';ctx.stroke();
 });
 // Trees and rocks drawn in depth order.
 let objects=[...trees.map(t=>({...t,kind:'tree'})),...rocks.map(r=>({...r,kind:'rock'}))].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
 objects.forEach(o=>{
  let p=screen(o.x,o.y);
  if(p.x<-70||p.x>W+70||p.y<-100||p.y>H+100)return;
  if(o.kind==='tree'){
   diamond(o.x,o.y+8, o.r*SX,o.r*SY,'#24482d');
   // trunk
   ctx.fillStyle='#745035';ctx.fillRect(p.x-4,p.y-o.h+8,8,o.h);
   // layered canopy
   diamond(o.x,o.y,o.r*SX*1.2,o.r*SY*1.2,'#215d35','#17472a');
   diamond(o.x-5,o.y-5,o.r*SX*.75,o.r*SY*.85,'#3e8a48');
   diamond(o.x,o.y-o.h,o.r*SX*.8,o.r*SY*.9,'#337940');
  }else{
   diamond(o.x,o.y+5,o.r*SX*1.2,o.r*SY*.8,'#253f2b');
   poly([[o.x-o.r,o.y,0],[o.x-o.r*.4,o.y-o.r*.8,o.h],[o.x+o.r*.6,o.y-o.r*.6,o.h],[o.x+o.r,o.y+o.r*.3,0]],'#737f7a','#a6afa0');
  }
 });
 // Base pads and crystal-like cores.
 function base(x,y,c){
  diamond(x,y,82,33,c+'66',c);
  poly([[x,y-30,0],[x+24,y,0],[x,y+30,0],[x-24,y,0]],'#dce8eb','#ffffff');
  poly([[x,y-30,0],[x+24,y,0],[x,y,30],[x-24,y,0]],c);
 }
 base(160,700,'#3297ff');base(1640,700,'#fa4e52');
 // Towers on lanes
 for(let i=0;i<3;i++){
  tower(280+i*115,700,'#2c8cff');
  tower(1520-i*115,700,'#ff4c50');
 }
 function tower(x,y,c){
  diamond(x,y+5,25,12,'#263a2a');
  poly([[x-15,y,0],[x+15,y,0],[x+11,y-38,0],[x-11,y-38,0]],'#746d68');
  let p=screen(x,y,-40);
  ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x+13,p.y+3);ctx.lineTo(p.x,p.y+14);ctx.lineTo(p.x-13,p.y+3);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffffff';ctx.stroke();
 }
}
function drawUnit(m){
 if(m.dead||m.hp<=0)return;
 let z=m.type==='monster'?5:0,p=screen(m.x,m.y,z);
 if(p.x<-60||p.x>W+60||p.y<-80||p.y>H+80)return;
 let c=m.type==='monster'?'#d4a043':m.team==='blue'?'#36a9ff':'#f34c57';
 diamond(m.x,m.y+6, m.r*SX*1.2,m.r*SY*.8,'#15291d88');
 // Raised body gives units a pseudo-3D silhouette.
 ctx.fillStyle=m.type==='monster'?'#8e652e':'#21354a';
 ctx.beginPath();ctx.ellipse(p.x,p.y+2,m.r*SX*.9,m.r*SY*.9,0,0,7);ctx.fill();
 ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(p.x,p.y-m.r*.25,m.r*SX,m.r*SY,0,0,7);ctx.fill();
 ctx.strokeStyle='#f0f4dc';ctx.lineWidth=1.5;ctx.stroke();
 if(m.type==='monster'){
  ctx.fillStyle='#f4d17a';ctx.beginPath();ctx.moveTo(p.x-8,p.y-6);ctx.lineTo(p.x-15,p.y-21);ctx.lineTo(p.x-3,p.y-14);ctx.moveTo(p.x+8,p.y-6);ctx.lineTo(p.x+15,p.y-21);ctx.lineTo(p.x+3,p.y-14);ctx.fill();
 }else{
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-4,p.y-3,2.5,0,7);ctx.arc(p.x+4,p.y-3,2.5,0,7);ctx.fill();
 }
 ctx.fillStyle='#18221d';ctx.fillRect(p.x-17,p.y-m.r*.8-13,34,4);
 ctx.fillStyle=m.type==='monster'?'#f5c34e':m.team==='blue'?'#45ed80':'#ff6a70';
 ctx.fillRect(p.x-17,p.y-m.r*.8-13,34*clamp(m.hp/m.max,0,1),4);
}
function drawHero(){
 if(hero.dead)return;
 let p=screen(hero.x,hero.y);
 diamond(hero.x,hero.y+8,22,10,'#14261c99');
 ctx.fillStyle='#174f6b';ctx.beginPath();ctx.ellipse(p.x,p.y-3,15,19,0,0,7);ctx.fill();
 ctx.fillStyle='#56e6ff';ctx.beginPath();ctx.ellipse(p.x,p.y-9,14,14,0,0,7);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#193f70';ctx.beginPath();ctx.ellipse(p.x,p.y-9,8,9,0,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-11,2,0,7);ctx.arc(p.x+3,p.y-11,2,0,7);ctx.fill();
 ctx.strokeStyle='#fff3a2';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(hero.face)*25,p.y+Math.sin(hero.face)*14);ctx.stroke();
 ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText('YOU',p.x,p.y-30);
}
function drawEffects(){
 effects.forEach(e=>{
  let p=screen(e.x,e.y);ctx.globalAlpha=Math.min(1,e.life*3);
  if(e.magic){ctx.strokeStyle='#68f5ff';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(p.x,p.y,e.r*SX*(1-e.life*.25),e.r*SY*(1-e.life*.25),0,0,7);ctx.stroke()}
  if(e.slash){ctx.strokeStyle='#fff2a6';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(p.x,p.y,28,13,0,0,Math.PI*1.5);ctx.stroke()}
  if(e.text){ctx.fillStyle='white';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(e.text,p.x,p.y-e.life*35)}
  ctx.globalAlpha=1;
 });
}
function drawMini(){
 mc.clearRect(0,0,180,140);mc.fillStyle='#397249';mc.fillRect(0,0,180,140);
 mc.fillStyle='#b7a47a';mc.fillRect(0,65,180,10);
 mc.fillStyle='#2783a7';mc.fillRect(88,0,9,140);
 mc.fillStyle='#3297ff';mc.fillRect(7,62,12,14);
 mc.fillStyle='#f64b53';mc.fillRect(161,62,12,14);
 mobs.forEach(m=>{if(!m.dead&&m.type==='monster'){mc.fillStyle='#f1c35c';mc.fillRect(m.x/world.w*180-2,m.y/world.h*140-2,4,4)}});
 mc.fillStyle='white';mc.beginPath();mc.arc(hero.x/world.w*180,hero.y/world.h*140,4,0,7);mc.fill();
}
function update(dt){
 hero.cd=Math.max(0,hero.cd-dt);hero.scd=Math.max(0,hero.scd-dt);hero.ucd=Math.max(0,hero.ucd-dt);
 hero.energy=Math.min(hero.maxEnergy,hero.energy+dt*2);
 if(hero.hp<=0&&!hero.dead){hero.dead=true;setTimeout(()=>{hero.dead=false;hero.hp=hero.max;hero.x=230;hero.y=700;say('Respawned at Blue Base!')},3000)}
 if(!hero.dead){
  let dx=joy.x,dy=joy.y;
  if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
  let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  if(l>.05){
   // Controls move through the isometric world axes.
   hero.x+=(dx+dy)*.707*hero.speed*dt;
   hero.y+=(dy-dx)*.707*hero.speed*dt;
   hero.face=Math.atan2(dy,dx);
  }
 }
 hero.x=clamp(hero.x,30,world.w-30);hero.y=clamp(hero.y,30,world.h-30);
 mobs.forEach(m=>{
  if(m.dead||m.hp<=0)return;
  m.cd=Math.max(0,m.cd-dt);
  if(m.type==='monster'){
   let d=dist(m,hero);
   if(d<190&&!hero.dead){
    if(d>45){m.x+=(hero.x-m.x)/d*m.speed*dt;m.y+=(hero.y-m.y)/d*m.speed*dt}
    else if(m.cd<=0){hero.hp-=35;m.cd=1.1}
   }else{
    let dh=Math.hypot(m.homeX-m.x,m.homeY-m.y);
    if(dh>8){m.x+=(m.homeX-m.x)/dh*m.speed*dt;m.y+=(m.homeY-m.y)/dh*m.speed*dt}
   }
   return;
  }
  let targets=mobs.filter(t=>!t.dead&&t.hp>0&&t.team!==m.team&&t.team!=='neutral'&&dist(m,t)<190);
  if(m.team==='red'&&!hero.dead&&dist(m,hero)<175)targets.push(hero);
  targets.sort((a,b)=>dist(m,a)-dist(m,b));let t=targets[0];
  if(t){
   let d=dist(m,t);
   if(d>m.r+t.r+8){m.x+=(t.x-m.x)/d*m.speed*dt;m.y+=(t.y-m.y)/d*m.speed*dt}
   else if(m.cd<=0){if(t===hero)hero.hp-=20;else damage(t,22);m.cd=.95}
  }else if(m.type==='minion'){
   let tx=m.team==='blue'?world.w-180:180,d=Math.hypot(tx-m.x,700-m.y);
   if(d>20){m.x+=(tx-m.x)/d*m.speed*dt;m.y+=(700-m.y)/d*m.speed*dt}
  }
 });
 effects.forEach(e=>e.life-=dt);effects=effects.filter(e=>e.life>0);
 // Camera follows hero in projected space.
 let p=project(hero.x,hero.y);
 camera.x+=(p.x-camera.x)*Math.min(1,dt*4);
 camera.y+=(p.y-camera.y)*Math.min(1,dt*4);
 document.getElementById('hp').style.width=clamp(hero.hp/hero.max*100,0,100)+'%';
 document.getElementById('mp').style.width=hero.energy/hero.maxEnergy*100+'%';
 document.getElementById('hptext').textContent='HP '+Math.max(0,Math.ceil(hero.hp))+'/'+hero.max;
 document.getElementById('mptext').textContent='Energy '+Math.floor(hero.energy)+'/'+hero.maxEnergy;
 document.getElementById('bs').textContent=blue;document.getElementById('rs').textContent=red;
 document.getElementById('kills').textContent='Kills: '+kills;
 document.getElementById('skill').innerHTML='✦<small>'+(hero.scd?'CD '+hero.scd.toFixed(1):'SKILL')+'</small>';
 document.getElementById('ult').innerHTML='☄<small>'+(hero.ucd?'CD '+hero.ucd.toFixed(1):'ULT')+'</small>';
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ground();
 // Sort by world depth so units and objects overlap naturally.
 let all=mobs.filter(m=>!m.dead&&m.hp>0).map(m=>({y:m.y,x:m.x,draw:()=>drawUnit(m)}));
 all.push(...trees.map(t=>({x:t.x,y:t.y,draw:()=>{}})));
 all.sort((a,b)=>(a.x+a.y)-(b.x+b.y));
 mobs.filter(m=>!m.dead&&m.hp>0).sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(drawUnit);
 drawHero();drawEffects();drawMini();
}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// Joystick touch handling
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
function moveJoy(e){
 let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,l=Math.hypot(dx,dy);
 if(l>max){dx*=max/l;dy*=max/l}
 joy.x=dx/max;joy.y=dy/max;
 knob.style.left=(r.width/2-22+dx)+'px';knob.style.top=(r.height/2-22+dy)+'px';
}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)moveJoy(e)});
function endJoy(){joy.x=joy.y=0;knob.style.left='';knob.style.top=''}
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);

// Tap a visible enemy on the arena to attack it.
canvas.addEventListener('pointerdown',e=>{
 if(e.clientY>H*.68)return;
 let wx=e.clientX-W/2+camera.x,wy=e.clientY-H/2+camera.y;
 let best=null,bd=Infinity;
 mobs.forEach(m=>{
  if(m.dead||m.team!=='red')return;
  let p=project(m.x,m.y),d=Math.hypot(p.x-wx,p.y-wy);
  if(d<35&&d<bd){best=m;bd=d}
 });
 if(best){hero.face=Math.atan2(best.y-hero.y,best.x-hero.x);attack()}
});
})();
</script>
